<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O&amp;M Property — Kickoff Workshop | Antimony Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#F9F3DC;--paper:#EAE2C9;--ink:#1E1E1E;--ink-soft:#4A463D;--muted:#8C8676;--line:#DDD4BB;
--blue:#3C64B1;--pink:#E8729A;--coral:#F98C82;--lilac:#C3A9F0;--peach:#F4BB98;--on-dark:#F9F3DC;--white:#FFFDF7}
html,body{height:100%}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
/* ---------- RAIL ---------- */
.rail{width:290px;flex:none;background:var(--ink);color:var(--on-dark);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.rail .top{padding:22px 22px 16px;border-bottom:1px solid rgba(249,243,220,.14)}
.rail .wm{height:20px;opacity:.95;filter:invert(1) brightness(1.7)}
.rail .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700;margin-top:10px}
.rail .cli{font-size:15px;font-weight:800;margin-top:2px}
.clock{padding:14px 22px;border-bottom:1px solid rgba(249,243,220,.14);display:flex;justify-content:space-between;align-items:baseline}
.clock .l{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(249,243,220,.5);font-weight:700}
.clock .v{font-size:20px;font-weight:800}
.clock .v small{font-size:11px;font-weight:600;opacity:.5}
.mods{flex:1;overflow-y:auto;padding:10px 0 20px}
.mods::-webkit-scrollbar{width:6px}.mods::-webkit-scrollbar-thumb{background:rgba(249,243,220,.18);border-radius:3px}
.gl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(249,243,220,.38);font-weight:700;padding:14px 22px 7px}
.mi{display:flex;align-items:center;gap:11px;padding:9px 22px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
.mi:hover{background:rgba(249,243,220,.06)}
.mi.on{background:rgba(249,243,220,.1);border-left-color:var(--pink)}
.mi.off{opacity:.34}
.mi .num{font-size:10px;font-weight:800;color:var(--pink);width:17px;flex:none}
.mi .tt{flex:1;min-width:0}
.mi .nm{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .mn{font-size:10px;color:rgba(249,243,220,.45);margin-top:1px}
.mi .dot{width:7px;height:7px;border-radius:50%;background:rgba(249,243,220,.2);flex:none}
.mi .dot.done{background:var(--coral)}
.tog{width:30px;height:17px;border-radius:9px;background:rgba(249,243,220,.2);position:relative;flex:none;transition:background .15s}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--cream);transition:left .15s}
.tog.on{background:var(--pink)}.tog.on:after{left:15px}
.rail .btm{padding:12px 16px;border-top:1px solid rgba(249,243,220,.14);display:flex;gap:7px;flex-wrap:wrap}
.rb{flex:1;min-width:0;background:rgba(249,243,220,.1);border:none;color:var(--on-dark);font-family:inherit;font-size:10.5px;font-weight:700;padding:8px 4px;border-radius:6px;cursor:pointer;white-space:nowrap}
.rb:hover{background:rgba(249,243,220,.2)}
.rb.pk{background:var(--pink);color:var(--ink)}.rb.pk:hover{background:#f085aa}
/* ---------- MAIN ---------- */
.main{flex:1;height:100vh;overflow-y:auto;position:relative}
.main::-webkit-scrollbar{width:9px}.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.bar{position:sticky;top:0;z-index:20;background:rgba(249,243,220,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);padding:11px 44px;display:flex;justify-content:space-between;align-items:center}
.bar .bl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar .br{display:flex;align-items:center;gap:14px}
.save{font-size:10.5px;color:var(--muted);font-weight:600}
.save b{color:var(--coral)}
.tmr{display:flex;align-items:center;gap:7px;background:var(--ink);color:var(--on-dark);padding:5px 11px;border-radius:20px}
.tmr .t{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.tmr button{background:none;border:none;color:var(--on-dark);cursor:pointer;font-size:11px;font-weight:700;opacity:.65;padding:2px 4px;font-family:inherit}
.tmr button:hover{opacity:1}
.wrap{max-width:880px;margin:0 auto;padding:40px 44px 120px}
.mhead{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:30px}
.mhead .kk{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--pink);font-weight:700;margin-bottom:8px}
.mhead h1{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.02}
.mhead .ld{font-size:16px;color:var(--ink-soft);margin-top:11px;line-height:1.5;max-width:640px}
.mhead .dl{display:inline-block;margin-top:13px;font-size:10.5px;font-weight:700;background:var(--paper);padding:4px 11px;border-radius:20px;color:var(--ink-soft)}
.ex{margin-bottom:34px}
.ex h3{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.ex .p{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.ex .body{margin-top:13px}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);background:var(--white);border:1.5px solid var(--line);border-radius:9px;padding:13px 15px;outline:none;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(60,100,177,.1)}
textarea{min-height:104px}
.info{background:var(--white);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:20px 24px}
.info h4{font-size:15px;font-weight:800;margin-bottom:9px}
.info .ib{font-size:14px;line-height:1.65;color:var(--ink-soft)}
.info .ib b{color:var(--ink)}
/* notes */
.nlist{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:11px}
.note{background:var(--peach);border-radius:8px;padding:11px 30px 11px 13px;font-size:13.5px;line-height:1.4;position:relative;max-width:270px;word-break:break-word;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.note:nth-child(4n+2){background:var(--lilac)}.note:nth-child(4n+3){background:var(--coral)}.note:nth-child(4n+4){background:var(--paper)}
.note .x{position:absolute;top:6px;right:7px;background:none;border:none;cursor:pointer;font-size:14px;line-height:1;opacity:.4;font-family:inherit}
.note .x:hover{opacity:1}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.addb{background:var(--ink);color:var(--on-dark);border:none;font-family:inherit;font-weight:700;font-size:13px;padding:0 18px;border-radius:9px;cursor:pointer;white-space:nowrap}
.addb:hover{background:var(--blue)}
/* pair */
.pair{display:flex;gap:14px}
.pair .col{flex:1}
.pair .cl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:7px;color:var(--blue)}
.pair .col:last-child .cl{color:var(--pink)}
/* slider */
.sl{margin-bottom:17px}
.sl .lb{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px}
.sl .lb span:first-child{color:var(--blue)}.sl .lb span:last-child{color:var(--pink)}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--pink));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:21px;height:21px;border-radius:50%;background:var(--cream);border:2.5px solid var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:21px;height:21px;border-radius:50%;background:var(--cream);border:2.5px solid var(--ink);cursor:pointer}
/* rank */
.rk{display:flex;align-items:center;gap:11px;background:var(--white);border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:7px}
.rk .pos{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.rk .lbl{flex:1;font-size:14px;font-weight:600}
.rk .mv{display:flex;gap:3px}
.rk .mv button{width:26px;height:26px;border:1.5px solid var(--line);background:var(--cream);border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;font-weight:700}
.rk .mv button:hover{background:var(--paper);border-color:var(--ink)}
.rk .mv button:disabled{opacity:.25;cursor:default}
/* rate */
.rt{background:var(--white);border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:8px}
.rt .nm{font-size:14px;font-weight:800;margin-bottom:8px}
.rt .row{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.rt .rl{font-size:10.5px;font-weight:700;color:var(--muted);width:104px;flex:none;text-transform:uppercase;letter-spacing:.05em}
.dots{display:flex;gap:4px}
.dots button{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);background:var(--cream);cursor:pointer;font-size:10px;font-weight:700;font-family:inherit;color:var(--muted)}
.dots button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rt .row:last-child .dots button.on{background:var(--pink);border-color:var(--pink);color:var(--ink)}
/* statement */
.st{background:var(--white);border:1.5px solid var(--line);border-radius:10px;padding:18px 20px}
.st .r{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.st .k{font-size:13.5px;font-weight:800;color:var(--blue);width:118px;flex:none;text-align:right}
.st .r input{flex:1}
.stprev{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.6;color:var(--ink-soft)}
.stprev b{color:var(--ink);font-weight:700}
.stprev .e{color:var(--muted);font-style:italic}
/* check */
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk button{background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:9px 15px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.chk button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
/* upload */
.upz{border:2px dashed var(--line);border-radius:11px;background:var(--white);padding:26px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.upz:hover,.upz.drag{border-color:var(--blue);background:#F4F0E2}
.upz .ui{font-size:14px;font-weight:700;color:var(--ink-soft)}
.upz .us{font-size:11.5px;color:var(--muted);margin-top:4px}
.ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:11px;margin-top:14px}
.uc{background:var(--white);border:1.5px solid var(--line);border-radius:9px;overflow:hidden;position:relative}
.uc .th{width:100%;height:96px;object-fit:cover;display:block;background:var(--paper)}
.uc .fp{width:100%;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);gap:5px}
.uc .fp .ic{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:.02em}
.uc .mt{padding:7px 9px}
.uc .fn{font-size:11px;font-weight:600;line-height:1.25;word-break:break-word;max-height:28px;overflow:hidden}
.uc .fs{font-size:10px;color:var(--muted);margin-top:2px}
.uc .x{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:rgba(30,30,30,.72);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;font-family:inherit;display:flex;align-items:center;justify-content:center}
.uc .x:hover{background:var(--ink)}
.ucount{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:10px}
/* nav */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
.nb{background:var(--ink);color:var(--on-dark);border:none;font-family:inherit;font-size:14px;font-weight:700;padding:13px 26px;border-radius:9px;cursor:pointer}
.nb:hover{background:var(--blue)}
.nb.gh{background:none;color:var(--muted);border:1.5px solid var(--line)}
.nb.gh:hover{background:var(--paper);color:var(--ink)}
.nb:disabled{opacity:.3;cursor:default}
/* post */
.pcard{background:var(--white);border-radius:12px;padding:22px 24px;margin-bottom:16px;border-top:5px solid var(--blue)}
.pcard.pink{border-top-color:var(--pink)}
.pcard .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.pcard .pw{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--blue)}
.pcard.pink .pw{color:var(--pink)}
.pitem{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:13px;align-items:flex-start}
.pitem .cb{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line);background:var(--cream);cursor:pointer;flex:none;margin-top:2px;font-size:11px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;color:transparent;font-family:inherit}
.pitem .cb.on{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.pitem .pt{flex:1}
.pitem .ptt{font-size:14.5px;font-weight:800;line-height:1.3}
.pitem.done .ptt{text-decoration:line-through;opacity:.45}
.pitem .ptd{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.pitem .due{font-size:10.5px;font-weight:800;background:var(--paper);padding:3px 9px;border-radius:20px;flex:none;white-space:nowrap}
@media(max-width:900px){.rail{display:none}.wrap{padding:26px 20px 100px}.mhead h1{font-size:32px}}
</style></head><body>

     function dots(k){ var s=''; for(var i=1;i<=5;i++) s+='<button class="'+(o[k]===i?'on':'')+'" data-rate="'+m.id+'|'+e.id+'|'+encodeURIComponent(it)+'|'+k+'|'+i+'">'+i+'</button>'; return s; }

 statement:function(m,e){

   var prev='For '+g('aud','audience')+' who '+g('need','need')+', O&amp;M Property is the '+g('cat','category')+' that '+g('ben','benefit')+', because '+g('rtb','reason to believe')+'.';
   return '<div class="st">'+rows+'<div class="stprev" id="stp_'+e.id+'">'+prev+'</div></div>';

 upload:function(m,e){

 },
 check:function(m,e){

/* ---------- VIEWS ---------- */
function view(){
  rail();
  var w=document.getElementById('wrap');
  if(cur===99){ w.innerHTML=postView(); document.getElementById('bl').textContent='After the workshop'; w.scrollTop=0; document.querySelector('.main').scrollTop=0; return; }
  var act=active();
  if(!act.length){ w.innerHTML='<div class="mhead"><h1>Nothing selected</h1></div>'; return; }
  if(cur>=MODULES.length)cur=0;
  var m=MODULES[cur];
  if(!S.opt[m.id]){ var nx=MODULES.findIndex(function(x){return S.opt[x.id];}); cur=nx<0?0:nx; m=MODULES[cur]; }
  var i=act.indexOf(m);
  document.getElementById('bl').textContent='Module '+m.n+' of '+act.length+' active';
  var h='<div class="mhead"><div class="kk">'+m.n+' &middot; '+(m.core?'The session':'Optional')+' &middot; '+m.mins+' min</div>'+
    '<h1>'+esc(m.t)+'</h1><div class="ld">'+esc(m.lede)+'</div>'+(m.d?'<div class="dl">'+esc(m.d)+'</div>':'')+'</div>';
  m.ex.forEach(function(e){
    h+='<div class="ex">'+(e.ty!=='info'?'<h3>'+esc(e.h)+'</h3>'+(e.p?'<div class="p">'+esc(e.p)+'</div>':''):'')+
      '<div class="body">'+R[e.ty](m,e)+'</div></div>';
  });
  var pi=i>0?act[i-1]:null, ni=i<act.length-1?act[i+1]:null;
  h+='<div class="nav">'+
    (pi?'<button class="nb gh" data-go="'+MODULES.indexOf(pi)+'">&larr; '+esc(pi.t)+'</button>':'<span></span>')+
    (ni?'<button class="nb" data-go="'+MODULES.indexOf(ni)+'">'+esc(ni.t)+' &rarr;</button>':'<button class="nb" data-go="99">Post-workshop &rarr;</button>')+
    '</div>';
  w.innerHTML=h; document.querySelector('.main').scrollTop=0;
}
function postView(){
  var h='<div class="mhead"><div class="kk">After the workshop</div><h1>What happens next</h1>'+
    '<div class="ld">The room gets us the thinking. This gets us the evidence. Tick these off as they land.</div></div>';
  POST.forEach(function(g,gi){
    var d=(S.post[g.who]||[]);
    h+='<div class="pcard '+(g.col==='pink'?'pink':'')+'"><div class="ph"><span class="pw">'+esc(g.who)+' to do</span></div>';
    g.items.forEach(function(it,ii){
      var k=gi+'_'+ii, on=d.indexOf(k)>=0;
      h+='<div class="pitem '+(on?'done':'')+'"><button class="cb '+(on?'on':'')+'" data-pk="'+g.who+'|'+k+'">&#10003;</button>'+
        '<span class="pt"><div class="ptt">'+esc(it.t)+'</div><div class="ptd">'+esc(it.d)+'</div></span>'+
        '<span class="due">'+esc(it.due)+'</span></div>';
    });
    h+='</div>';
  });
  h+='<div class="nav"><button class="nb gh" data-go="0">&larr; Back to the session</button><button class="nb" id="expmd2">Export everything &rarr;</button></div>';
  return h;
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target, d;
  if((d=t.closest('[data-tog]'))){ var id=d.dataset.tog; S.opt[id]=!S.opt[id]; save(); view(); ev.stopPropagation(); return; }
  if((d=t.closest('[data-go]'))){ cur=parseInt(d.dataset.go,10); view(); return; }
  if((d=t.closest('[data-del]'))){ var p=d.dataset.del.split('|'); var a=A(p[0],p[1])||[]; a.splice(+p[2],1); A(p[0],p[1],a); view(); return; }
  if((d=t.closest('[data-updel]'))){ var p=d.dataset.updel.split('|'); var a=A(p[0],p[1])||[]; a.splice(+p[2],1); A(p[0],p[1],a); view(); return; }
  if((d=t.closest('[data-addb]'))){ var p=d.dataset.addb.split('|'); var inp=document.querySelector('[data-add="'+p[0]+'|'+p[1]+'"]');
    if(inp&&inp.value.trim()){ var a=A(p[0],p[1])||[]; a.push(inp.value.trim()); A(p[0],p[1],a); view(); } return; }
  if((d=t.closest('[data-pdel]'))){ var p=d.dataset.pdel.split('|'); var o=A(p[0],p[1])||{a:[],b:[]}; o[p[2]].splice(+p[3],1); A(p[0],p[1],o); view(); return; }
  if((d=t.closest('[data-rk]'))){ var p=d.dataset.rk.split('|'); var e=MODULES.find(function(x){return x.id===p[0];}).ex.find(function(x){return x.id===p[1];});
    var a=A(p[0],p[1])||e.items.slice(); var i=+p[2], j=i+(+p[3]); if(j<0||j>=a.length)return; var tmp=a[i];a[i]=a[j];a[j]=tmp; A(p[0],p[1],a); view(); return; }
  if((d=t.closest('[data-rate]'))){ var p=d.dataset.rate.split('|'); var v=A(p[0],p[1])||{}; var it=decodeURIComponent(p[2]);
    if(!v[it])v[it]={}; v[it][p[3]]=(v[it][p[3]]===+p[4])?null:+p[4]; A(p[0],p[1],v); view(); return; }
  if((d=t.closest('[data-ck]'))){ var p=d.dataset.ck.split('|'); var x=decodeURIComponent(p[2]); var a=A(p[0],p[1])||[];
    var k=a.indexOf(x); if(k>=0)a.splice(k,1); else a.push(x); A(p[0],p[1],a); view(); return; }
  if((d=t.closest('[data-pk]'))){ var p=d.dataset.pk.split('|'); if(!S.post[p[0]])S.post[p[0]]=[]; var a=S.post[p[0]];
    var k=a.indexOf(p[1]); if(k>=0)a.splice(k,1); else a.push(p[1]); save(); view(); return; }
  if(t.id==='expmd2'){ expMD(); return; }
});
document.addEventListener('input',function(ev){
  var t=ev.target,d;
  if((d=t.dataset.t)){ var p=d.split('|'); A(p[0],p[1],t.value); return; }
  if((d=t.dataset.sl)){ var p=d.split('|'); var v=A(p[0],p[1])||{}; v[p[2]]=+t.value; A(p[0],p[1],v); return; }

    return; }
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return; var t=ev.target,d;
  if((d=t.dataset.add)){ var p=d.split('|'); if(!t.value.trim())return; var a=A(p[0],p[1])||[]; a.push(t.value.trim()); A(p[0],p[1],a); view(); }
  if((d=t.dataset.padd)){ var p=d.split('|'); if(!t.value.trim())return; var o=A(p[0],p[1])||{a:[],b:[]}; if(!o[p[2]])o[p[2]]=[]; o[p[2]].push(t.value.trim()); A(p[0],p[1],o); view(); }
});

/* ---------- UPLOADS ---------- */
function fmtSize(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function addFiles(mid,eid,files){
  var arr=A(mid,eid)||[]; var pending=files.length;
  if(!pending)return;
  Array.prototype.forEach.call(files,function(file){
    var r=new FileReader();
    r.onload=function(){
      var ext=(file.name.split('.').pop()||'FILE').toUpperCase().slice(0,4);
      arr.push({name:file.name, type:file.type, ext:ext, size:fmtSize(file.size), data:r.result});
      pending--; if(pending===0){ A(mid,eid,arr); view(); }
    };
    r.onerror=function(){ pending--; if(pending===0){ A(mid,eid,arr); view(); } };
    r.readAsDataURL(file);
  });
}
document.addEventListener('click',function(ev){
  var d=ev.target.closest&&ev.target.closest('[data-upz]');
  if(d){ var p=d.dataset.upz.split('|'); var inp=document.querySelector('[data-upi="'+p[0]+'|'+p[1]+'"]'); if(inp)inp.click(); }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.upi){ var p=t.dataset.upi.split('|'); addFiles(p[0],p[1],t.files); t.value=''; }
});
document.addEventListener('dragover',function(ev){ var d=ev.target.closest&&ev.target.closest('[data-upz]'); if(d){ ev.preventDefault(); d.classList.add('drag'); } });
document.addEventListener('dragleave',function(ev){ var d=ev.target.closest&&ev.target.closest('[data-upz]'); if(d)d.classList.remove('drag'); });
document.addEventListener('drop',function(ev){
  var d=ev.target.closest&&ev.target.closest('[data-upz]');
  if(d){ ev.preventDefault(); d.classList.remove('drag'); var p=d.dataset.upz.split('|'); if(ev.dataTransfer&&ev.dataTransfer.files)addFiles(p[0],p[1],ev.dataTransfer.files); }
});

/* ---------- TIMER ---------- */
var tsec=0,trun=null;
function tfmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function ttick(){document.getElementById('tv').textContent=tfmt(tsec);}
document.getElementById('tgo').addEventListener('click',function(){
  if(trun){clearInterval(trun);trun=null;this.textContent='Start';}
  else{trun=setInterval(function(){tsec++;ttick();},1000);this.textContent='Pause';}
});
document.getElementById('trs').addEventListener('click',function(){tsec=0;ttick();});

/* ---------- EXPORT ---------- */
function dl(name,txt,mime){
  var b=new Blob([txt],{type:mime||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}
function expJSON(){ dl('OM_Workshop_'+(function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);})(new Date())+'.json',JSON.stringify(S,null,2),'application/json'); }
function expMD(){
  var L=['# O&M Property — Kickoff Workshop','','Facilitated by Antimony Studio · '+new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'}),''];
  MODULES.forEach(function(m){
    if(!S.opt[m.id])return; var g=S.a[m.id]||{}; var any=m.ex.some(function(e){return e.ty!=='info'&&g[e.id];});
    if(!any)return;
    L.push('## '+m.n+' · '+m.t); if(m.d)L.push('*'+m.d+'*'); L.push('');
    m.ex.forEach(function(e){
      var v=g[e.id]; if(e.ty==='info'||!v)return;
      L.push('### '+e.h);
      if(e.ty==='text'){L.push(v);}
      else if(e.ty==='notes'){v.forEach(function(x){L.push('- '+x);});}
      else if(e.ty==='pair'){L.push('**'+e.la+'**');(v.a||[]).forEach(function(x){L.push('- '+x);});L.push('');L.push('**'+e.lb+'**');(v.b||[]).forEach(function(x){L.push('- '+x);});}
      else if(e.ty==='slider'){e.items.forEach(function(p,i){var n=v[i]!==undefined?v[i]:50;L.push('- '+p[0]+' ←→ '+p[1]+': **'+n+'** '+(n<40?'('+p[0].toLowerCase()+')':n>60?'('+p[1].toLowerCase()+')':'(middle)'));});}
      else if(e.ty==='rank'){v.forEach(function(x,i){L.push((i+1)+'. '+x);});}
      else if(e.ty==='rate'){L.push('| Item | '+e.ca+' | '+e.cb+' |');L.push('| --- | --- | --- |');e.items.forEach(function(it){var o=v[it]||{};L.push('| '+it+' | '+(o.a||'–')+' | '+(o.b||'–')+' |');});}
      else if(e.ty==='statement'){L.push('> For **'+(v.aud||'…')+'** who **'+(v.need||'…')+'**, O&M Property is the **'+(v.cat||'…')+'** that **'+(v.ben||'…')+'**, because **'+(v.rtb||'…')+'**.');}
      else if(e.ty==='check'){v.forEach(function(x){L.push('- '+x);});}
      else if(e.ty==='upload'){L.push(v.length+' file(s) uploaded:');v.forEach(function(x){L.push('- '+x.name+' ('+x.size+')');});}
      L.push('');
    });
  });
  L.push('---','','## After the workshop','');
  POST.forEach(function(g,gi){ L.push('### '+g.who+' to do','');
    g.items.forEach(function(it,ii){ var on=(S.post[g.who]||[]).indexOf(gi+'_'+ii)>=0;
      L.push('- ['+(on?'x':' ')+'] **'+it.t+'** — '+it.d+' *(due '+it.due+')*'); }); L.push(''); });
  dl('OM_Workshop_'+(function(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);})(new Date())+'.md',L.join('\n'),'text/markdown');
}
document.getElementById('ej').addEventListener('click',expJSON);
document.getElementById('em').addEventListener('click',expMD);
document.getElementById('imp').addEventListener('click',function(){document.getElementById('fi').click();});
document.getElementById('fi').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f)return; var r=new FileReader();
  r.onload=function(){ try{ S=Object.assign({a:{},opt:{},post:{}},JSON.parse(r.result));
    MODULES.forEach(function(m){ if(S.opt[m.id]===undefined)S.opt[m.id]=m.core; });
    save(); cur=0; view(); }catch(x){ alert('That file could not be read.'); } };
  r.readAsText(f);
});
document.getElementById('rst').addEventListener('click',function(){
  if(!confirm('Clear every answer and start fresh? Export a backup first if you need one.'))return;
  S={a:{},opt:{},post:{}}; MODULES.forEach(function(m){S.opt[m.id]=m.core;}); save(); cur=0; view();
});
view(); ttick();
</script>
